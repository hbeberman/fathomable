# @okf-doc: /commit-hooks.md
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cargo-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install development and release Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install "$(python3 scripts/rust-toolchain.py release)" --profile minimal --component clippy,rustfmt
      - name: Install nightly Rust for public API checks
        run: rustup toolchain install nightly --profile minimal
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install development tools
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: cargo-audit@0.22.1,cargo-about@0.9.2,cargo-deny@0.19.9,cargo-nextest@0.9.138,just@1.55.1,lychee@0.24.2,prek@0.5.3
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked --version 0.51.0
      - name: Install documentation lint dependencies
        run: python3 -m pip install --requirement requirements-docs.txt
      - name: Install checksum-pinned Betterleaks
        run: python3 scripts/betterleaks.py install
      - name: Test contributor helpers
        run: python3 -m unittest scripts/test-demo-repo.py scripts/test-perf-record.py scripts/test-rust-toolchain.py scripts/test-betterleaks.py scripts/test-package.py
      - name: Format
        run: prek run --config prek.toml --all-files fmt
      - name: Test commit hooks
        run: prek run --config prek.toml --all-files commit-hooks
      - name: Clippy
        run: prek run --config prek.toml --all-files clippy
      - name: Test
        run: prek run --config prek.toml --all-files nextest
      - name: Test documentation
        run: prek run --config prek.toml --all-files doctest
      - name: Check documentation bundle
        run: prek run --config prek.toml --all-files okf links
      - name: Boundary checks
        run: prek run --config prek.toml --all-files boundaries
      - name: Public API checks
        run: prek run --config prek.toml --all-files public-api
      - name: Rustdoc
        run: prek run --config prek.toml --all-files rustdoc
      - name: Audit dependencies
        run: prek run --config prek.toml --all-files audit
      - name: Deny check
        run: prek run --config prek.toml --all-files deny
      - name: Check bundled license notices
        run: prek run --config prek.toml --all-files licenses
      - name: Scan tracked checkout for secrets
        run: prek run --config prek.toml --all-files secrets

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msrv, stable]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Select compatibility compiler
        run: |
          channel=stable
          if [ "${{ matrix.toolchain }}" = msrv ]; then
            channel=$(python3 scripts/rust-toolchain.py msrv)
          fi
          rustup toolchain install "$channel" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: compatibility-${{ matrix.toolchain }}
      - name: Build with locked dependencies
        run: cargo build --workspace --all-targets --all-features --locked
      - name: Test with locked dependencies
        run: cargo test --workspace --all-features --locked
