# @okf-doc: /secret-scanning.md
name: Secret scanning

on:
  pull_request:
  push:
  schedule:
    - cron: "43 09 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Never execute scanner helpers or load rules from an untrusted PR.
      # This is pull_request, not pull_request_target; no secrets are provided.
      - name: Check out trusted scan policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: policy
          persist-credentials: false
      - name: Check out all available source history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Betterleaks
        run: python3 policy/scripts/betterleaks.py install
      - name: Scan introduced commits or scheduled full history
        run: python3 policy/scripts/betterleaks.py ci --repo source --event "$GITHUB_EVENT_PATH"
