# @okf-doc: /decisions/0002-crate-layout.md
[workspace]
members = [
    "crates/fathomable",
    "crates/fathomable-core",
    "crates/fathomable-testing",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# Mirrors the rust-toolchain.toml pin (ADR 0001); a floor, not a support promise.
rust-version = "1.97"
authors = ["Project contributors"]
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/hbeberman/fathomable"
description = "Read-only terminal workspace viewer and annotation side-car for agent-driven work"
keywords = ["tui", "markdown", "mcp", "review"]
categories = ["development-tools"]
publish = false

[workspace.dependencies]
# Versions live here; each crate names the features it needs (ADR 0001).
fathomable-core = { path = "crates/fathomable-core", version = "0.1.0" }
fathomable-testing = { path = "crates/fathomable-testing", version = "0.1.0" }
anyhow = "1.0.104"
cap-std = "4.0.3"
clap = "4.6.6"
crossterm = "0.29.0"
gix = { version = "0.87", default-features = false }
kdl = { version = "6", default-features = false }
notify = "8"
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false }
regex = "1"
rmcp = { version = "3.1.4", default-features = false }
serde = "1"
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
syntect = { version = "5.3.0", default-features = false }
thiserror = "2.0.20"
tokio = { version = "1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-segmentation = "1"
unicode-width = "0.2"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
enum_glob_use = "warn"
expect_used = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
implicit_clone = "warn"
map_err_ignore = "warn"
panic = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unwrap_used = "warn"
unused_result_ok = "warn"
wildcard_imports = "warn"

[profile.bench]
debug = 1

[profile.release]
debug = "line-tables-only"
