[package]
name = "fathomable-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description = "Terminal-free core for Fathomable: document model, layout, annotations, sessions"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gix = { workspace = true, features = ["attributes", "excludes", "index", "sha1"] }
kdl = { workspace = true, features = ["span"] }
nucleo-matcher.workspace = true
pulldown-cmark.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
syntect = { workspace = true, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy", "dump-load"] }
thiserror.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[dev-dependencies]
fathomable-testing.workspace = true
