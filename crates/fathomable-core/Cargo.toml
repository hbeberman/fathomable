[package]
name = "fathomable-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description = "Terminal-free core for Fathomable: document model, layout, annotations, sessions"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gix = { version = "0.87", default-features = false, features = ["attributes", "excludes", "index", "sha1"] }
kdl = { version = "6", default-features = false, features = ["span"] }
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy", "dump-load"] }
thiserror = "2.0.20"
tracing = "0.1.44"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
fathomable-testing = { version = "0.1.0", path = "../fathomable-testing" }
