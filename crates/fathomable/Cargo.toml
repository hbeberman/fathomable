[package]
name = "fathomable"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
fathomable-core = { version = "0.1.0", path = "../fathomable-core" }
notify = "8"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
regex = "1"
rmcp = { version = "3.1.4", default-features = false, features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "net", "io-util", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
fathomable-testing = { version = "0.1.0", path = "../fathomable-testing" }
