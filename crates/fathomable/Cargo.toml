# @okf-doc: /decisions/0002-crate-layout.md
[package]
name = "fathomable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
license-file.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
exclude = ["examples/seed.rs"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
cap-std.workspace = true
clap = { workspace = true, features = ["derive"] }
crossterm.workspace = true
fathomable-core.workspace = true
notify.workspace = true
ratatui = { workspace = true, features = ["crossterm_0_29"] }
regex.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[dev-dependencies]
fathomable-testing = { path = "../fathomable-testing" }
