# @okf-doc: /decisions/0001-dependency-policy.md
# cargo-deny policy per docs/decisions/0001-dependency-policy.md.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # bincode 1.3.3 is "unmaintained" (development ceased), not vulnerable;
    # syntect's bundled syntax and theme dumps need it and the advisory
    # itself calls 1.3.3 complete. Revisit when syntect drops it (ADR 0016).
    { id = "RUSTSEC-2025-0141", reason = "syntect dump-load; unmaintained, not a vulnerability" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
name = "winx"
version = "=0.36.4"
allow = ["Apache-2.0 WITH LLVM-exception"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
