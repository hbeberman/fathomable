# @okf-doc: /decisions/0088-bundled-licenses.md
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
targets = ["x86_64-unknown-linux-gnu"]
ignore-dev-dependencies = true
private = { ignore = true }

# chrono ships both alternatives in one file; retain its copyright preamble.
[chrono.clarify]
license = "MIT OR Apache-2.0"
[[chrono.clarify.files]]
path = "LICENSE.txt"
checksum = "946c9835d8034d24404f8cfec5f4654cee5dad17e944afc3d06d742cf2882831"

# The packaged Apache text does not pass the automatic recognition threshold.
[ryu.clarify]
license = "Apache-2.0 OR BSL-1.0"
[[ryu.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "62c7a1e35f56406896d7aa7ca52d0cc0d272ac022b5d2796e7d6905db8a3636a"
